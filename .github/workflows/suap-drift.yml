name: SUAP API drift detector

on:
  schedule:
    - cron: "0 9 * * *" # ~06:00 BRT
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm suap:check-ops

      - id: assert
        env:
          TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/assert-suap-ops.mts

      - if: steps.assert.outputs.result == 'ok'
        run: pnpm suap:gen

      - id: drift
        if: steps.assert.outputs.result == 'ok'
        run: |
          if [ -z "$(git status --porcelain src/lib/suap/generated/)" ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - id: pr
        if: steps.drift.outputs.drifted == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: master
          branch: chore/suap-api-drift
          title: "chore: update SUAP API generated client (drift detected)"
          commit-message: "chore: regenerate SUAP client - API drift detected"
          body: |
            The SUAP OpenAPI spec changed in one of the monitored operations
            (`meusPeriodosLetivos`, `meuBoletim`, `meusDadosAluno`), so the
            committed client in `src/lib/suap/generated/` is out of date.

            This PR is the regenerated client. Review the diff to confirm the
            Server Actions that consume it still typecheck, then merge.

            > Auto-generated by `.github/workflows/suap-drift.yml`. The branch is
            > machine-managed (force-pushed) — don't commit to it by hand.
          labels: suap-api-drift

      - if: steps.drift.outputs.drifted == 'true'
        env:
          TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: node scripts/notify-drift.mts
